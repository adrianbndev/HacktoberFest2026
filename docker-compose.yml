services:
  lifeos-backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  lifeos-web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npx next dev -H 0.0.0.0"
    environment:
      FASTAPI_INTERNAL_URL: http://lifeos-backend:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - lifeos-backend

  # Opcional, si el Wi-Fi aísla los dispositivos: docker compose --profile tunnel up
  # La URL pública https://*.trycloudflare.com aparece en los logs de este servicio.
  mobile-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://lifeos-web:3000
    depends_on:
      - lifeos-web
    profiles: ["tunnel"]
