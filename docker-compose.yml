services:
  lifeos-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lifeos-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      MARKET_ALLOW_FALLBACK: ${MARKET_ALLOW_FALLBACK:-true}
      MARKET_JITTER_MIN_SEC: ${MARKET_JITTER_MIN_SEC:-0.2}
      MARKET_JITTER_MAX_SEC: ${MARKET_JITTER_MAX_SEC:-0.6}
      MARKET_CONNECTOR_TIMEOUT_SEC: ${MARKET_CONNECTOR_TIMEOUT_SEC:-1.6}
      MARKET_DEADLINE_SEC: ${MARKET_DEADLINE_SEC:-2.8}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FAST_MODEL: ${DEEPSEEK_FAST_MODEL:-deepseek-flash}
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
      CDP_URL: ${DOCKER_CDP_URL:-http://market-browser:9222}
      MARKET_ANALYSIS_ENABLED: ${MARKET_ANALYSIS_ENABLED:-true}
      MARKET_ANALYSIS_DEADLINE_SEC: ${MARKET_ANALYSIS_DEADLINE_SEC:-60}
      MARKET_SOURCE_TIMEOUT_SEC: ${MARKET_SOURCE_TIMEOUT_SEC:-25}
      MARKET_BROWSER_TIMEOUT_SEC: ${MARKET_BROWSER_TIMEOUT_SEC:-45}
      MARKET_PLATFORM_QUOTA: ${MARKET_PLATFORM_QUOTA:-4}
      MARKET_MILANUNCIOS_MAX_PAGES: ${MARKET_MILANUNCIOS_MAX_PAGES:-3}
      MARKET_MILANUNCIOS_PAGE_DELAY_MIN_SEC: ${MARKET_MILANUNCIOS_PAGE_DELAY_MIN_SEC:-0.25}
      MARKET_MILANUNCIOS_PAGE_DELAY_MAX_SEC: ${MARKET_MILANUNCIOS_PAGE_DELAY_MAX_SEC:-0.75}
      MARKET_MILANUNCIOS_TRANSPORT: ${MARKET_MILANUNCIOS_TRANSPORT:-auto}
      MARKET_BROWSER_POOL_SIZE: ${MARKET_BROWSER_POOL_SIZE:-2}
      MARKET_SOURCE_CONCURRENCY: ${MARKET_SOURCE_CONCURRENCY:-3}
      MARKET_CACHE_PATH: /app/data/market_cache.sqlite
      MARKET_CACHE_TTL_SEC: ${MARKET_CACHE_TTL_SEC:-900}
    ports:
      - "8001:8000"
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      - market-cache:/app/data
    depends_on:
      market-browser:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/market/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  lifeos-web:
    profiles: ["web"]
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npx next dev -H 0.0.0.0"
    environment:
      FASTAPI_INTERNAL_URL: http://lifeos-backend:8000
      FASTAPI_MARKET_URL: http://lifeos-backend:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - lifeos-backend

  # Opcional, si el Wi-Fi aísla los dispositivos: docker compose --profile tunnel up
  # La URL pública https://*.trycloudflare.com aparece en los logs de este servicio.
  mobile-tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://lifeos-web:3000
    depends_on:
      - lifeos-web
    profiles: ["tunnel"]

  market-browser:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    image: market-browser:local
    ports:
      - "9222:9222"
    environment:
      DISPLAY: ":99"
      TZ: Europe/Madrid
      LANG: es_ES.UTF-8
      LANGUAGE: es_ES:es
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
    shm_size: 2g
    volumes:
      - chrome-profile:/chrome-profile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 25s
    restart: unless-stopped

volumes:
  chrome-profile:
  market-cache:
